[project]
name = "langchain-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vatsan127", email = "vatsan127@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "langchain>=1.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-rag = "langchain_rag:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
